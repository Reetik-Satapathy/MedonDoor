<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking History - MedOnDoor</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container">
    <div class="dashboard-header">
      <h2 class="dashboard-title">My Bookings</h2>
    </div>

    <div id="history">
      <div class="empty-state">
        <p>Loading your bookings...</p>
      </div>
    </div>

    <div class="actions">
      <button id="backBtn" class="secondary">
        ← Back to Booking
      </button>
      <button id="logoutBtn" class="danger">
        Logout
      </button>
    </div>
  </div>

  <script src="../js/history.js"></script>
</body>
</html>
