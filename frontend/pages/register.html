<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MedOnDoor</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container">
    <h2>Create Account</h2>
    <p class="text-center" style="color: var(--text-secondary); margin-bottom: var(--spacing-xl);">
      Join MedOnDoor to access healthcare services
    </p>

    <form id="registerForm">
      <input 
        type="text" 
        id="name" 
        placeholder="Full Name" 
        required
        autocomplete="name"
      >
      <input 
        type="email" 
        id="email" 
        placeholder="Email address" 
        required
        autocomplete="email"
      >
      <input 
        type="password" 
        id="password" 
        placeholder="Password" 
        required
        autocomplete="new-password"
        minlength="6"
      >
      
      <select id="role" required>
        <option value="">Select Account Type</option>
        <option value="user">Patient / User</option>
        <option value="provider">Healthcare Provider</option>
      </select>

      <select id="serviceType" class="hidden">
        <option value="">Select Service Type</option>
        <option value="doctor">Doctor Consultation</option>
        <option value="nurse">Nurse Home Visit</option>
        <option value="delivery">Medicine Delivery</option>
      </select>

      <button type="submit" id="registerBtn">
        Create Account
      </button>
    </form>

    <p id="error" class="error hidden"></p>

    <p class="link">
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
